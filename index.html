<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Style Video Dashboard</title>
    <style>
        :root {
            --bg-base: #f2f2f7;
            --bg-surface: #ffffff;
            --bg-hover: #f5f5f7;
            --border-color: #e5e5ea;
            --accent: #007aff;
            --accent-hover: #005ec4;
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        /* Control Bars Container */
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Input Cards */
        .control-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow);
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg-base);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            background: var(--bg-surface);
            border-color: var(--accent);
        }

        .action-btn, .file-label {
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            transition: background 0.2s ease;
        }

        .action-btn:hover, .file-label:hover {
            background: var(--accent-hover);
        }

        input[type="file"] {
            display: none;
        }

        .control-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Layout Grid */
        .content-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .content-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Player Section */
        .player-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            outline: none;
        }

        .video-info {
            padding: 14px 16px;
            border-top: 1px solid var(--border-color);
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Sidebar Playlist */
        .sidebar {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .playlist-item {
            background: var(--bg-base);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .playlist-item:hover {
            background: var(--bg-hover);
        }

        .playlist-item.active {
            background: rgba(0, 122, 255, 0.1);
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>My Video Dashboard</h1>

        <div class="controls-container">
            <div class="control-card">
                <span class="control-label">URL Stream:</span>
                <input type="text" id="videoUrlInput" placeholder="Paste direct .mp4 link..." />
                <button class="action-btn" id="loadUrlBtn">Load Link</button>
            </div>

            <div class="control-card">
                <span class="control-label" id="fileStatusText">Device File:</span>
                <label class="file-label">
                    Browse File
                    <input type="file" id="localFileInput" accept="video/*">
                </label>
            </div>
        </div>

        <div class="content-layout">
            <div class="player-wrapper">
                <video id="mainVideoPlayer" controls playsinline></video>
                <div class="video-info">
                    <div class="video-title" id="currentVideoTitle">Select a preset or load a source</div>
                </div>
            </div>

            <div class="sidebar">
                <div class="section-title">Presets</div>
                <div class="playlist" id="playlistContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('mainVideoPlayer');
        const videoTitle = document.getElementById('currentVideoTitle');
        const playlistContainer = document.getElementById('playlistContainer');
        const videoUrlInput = document.getElementById('videoUrlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');
        const localFileInput = document.getElementById('localFileInput');
        const fileStatusText = document.getElementById('fileStatusText');

        // Sample presets
        const samplePlaylist = [
            { title: "Big Buck Bunny", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
            { title: "Sample Video 2", url: "https://www.w3schools.com/html/movie.mp4" }
        ];

        // Build preset playlist UI
        samplePlaylist.forEach((item, index) => {
            const btn = document.createElement('button');
            btn.className = `playlist-item ${index === 0 ? 'active' : ''}`;
            btn.textContent = item.title;
            
            btn.onclick = () => {
                document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
                btn.classList.add('active');
                
                videoUrlInput.value = item.url;
                videoPlayer.src = item.url;
                videoTitle.textContent = item.title;
                videoPlayer.load();
                videoPlayer.play().catch(e => console.log("Auto-play prevented:", e));
            };

            playlistContainer.appendChild(btn);
        });

        // Initialize with the first sample
        if (samplePlaylist.length > 0) {
            videoPlayer.src = samplePlaylist[0].url;
            videoTitle.textContent = samplePlaylist[0].title;
            videoUrlInput.value = samplePlaylist[0].url;
        }

        // Load pasted link
        loadUrlBtn.onclick = () => {
            const url = videoUrlInput.value.trim();
            if (url) {
                videoPlayer.src = url;
                videoTitle.textContent = "Custom Link Stream";
                document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
                videoPlayer.load();
                videoPlayer.play().catch(e => alert("Could not play video. Make sure it's a direct media link!"));
            }
        };

        // Load local file from computer
        localFileInput.onchange = (event) => {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoPlayer.src = fileURL;
                videoTitle.textContent = `Local File: ${file.name}`;
                fileStatusText.textContent = `Loaded: ${file.name}`;
                document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
                videoPlayer.load();
                videoPlayer.play();
            }
        };
    </script>
</body>
</html>
