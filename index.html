<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro iOS Video Player</title>
    <style>
        :root {
            --bg-base: #f5f5f7;
            --bg-surface: #ffffff;
            --bg-hover: #e8e8ed;
            --border-color: #d2d2d7;
            --accent: #007aff;
            --accent-hover: #005ec4;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --radius: 8px;
            --shadow: 0 1px 6px rgba(0, 0, 0, 0.03);
        }

        [data-theme="dark"] {
            --bg-base: #000000;
            --bg-surface: #1c1c1e;
            --bg-hover: #2c2c2e;
            --border-color: #38383a;
            --accent: #0a84ff;
            --accent-hover: #0062cc;
            --text-main: #f5f5f7;
            --text-muted: #98989d;
            --shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
        }

        h1 {
            font-size: 12px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .header-controls {
            display: flex;
            gap: 3px;
        }

        select, .theme-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 1px 4px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        .info-bar {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 4px 8px;
            box-shadow: var(--shadow);
        }

        .info-text {
            font-size: 9px;
            color: var(--text-muted);
            line-height: 1.25;
            margin: 0;
        }

        .control-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 4px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: var(--shadow);
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            background: var(--bg-base);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 9px;
            outline: none;
        }

        input[type="text"]:focus {
            background: var(--bg-surface);
            border-color: var(--accent);
        }

        .action-btn, .file-label {
            background: var(--accent);
            color: white;
            border: none;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            font-size: 9px;
            white-space: nowrap;
        }

        .action-btn:hover, .file-label:hover {
            background: var(--accent-hover);
        }

        input[type="file"] {
            display: none;
        }

        .player-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            outline: none;
        }

        .video-info {
            padding: 3px 6px;
            border-top: 1px solid var(--border-color);
        }

        .video-title {
            font-size: 9px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header-row">
            <h1 id="appTitle">Player</h1>
            <div class="header-controls">
                <select id="langSelect" aria-label="Language">
                    <option value="en">EN</option>
                    <option value="zh">中</option>
                    <option value="ja">日</option>
                    <option value="de">DE</option>
                    <option value="ko">한</option>
                    <option value="fr">FR</option>
                    <option value="it">IT</option>
                    <option value="fa">فا</option>
                </select>
                <button class="theme-btn" id="themeToggleBtn">Theme</button>
            </div>
        </div>

        <div class="info-bar">
            <p class="info-text" id="infoDesc">Paste direct video link (.mp4/.webm) or pick a local device file.</p>
        </div>

        <div class="control-card">
            <input type="text" id="videoUrlInput" placeholder="URL..." />
            <button class="action-btn" id="loadUrlBtn">Load</button>
            <label class="file-label" id="labelBrowse">
                File
                <input type="file" id="localFileInput" accept="video/*">
            </label>
        </div>

        <div class="player-wrapper">
            <video id="mainVideoPlayer" controls playsinline></video>
            <div class="video-info">
                <div class="video-title" id="currentVideoTitle">No video</div>
            </div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('mainVideoPlayer');
        const videoTitle = document.getElementById('currentVideoTitle');
        const videoUrlInput = document.getElementById('videoUrlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');
        const localFileInput = document.getElementById('localFileInput');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const langSelect = document.getElementById('langSelect');
        const htmlElement = document.documentElement;

        let activeSourceType = 'none';

        const translations = {
            en: { title: "Player", desc: "Paste direct video link (.mp4/.webm) or pick a local device file.", load: "Load", file: "File", none: "No video", custom: "Stream" },
            zh: { title: "播放器", desc: "粘贴直接视频链接 (.mp4/.webm) 或选择本地文件。", load: "加载", file: "文件", none: "无视频", custom: "流" },
            ja: { title: "プレーヤー", desc: "直接リンク (.mp4/.webm) を貼り付けるかファイルを選択。", load: "読込", file: "ファイル", none: "動画なし", custom: "ストリーム" },
            de: { title: "Player", desc: "Direkten Link (.mp4/.webm) einfügen oder lokale Datei wählen.", load: "Laden", file: "Datei", none: "Kein Video", custom: "Stream" },
            ko: { title: "플레이어", desc: "직접 비디오 링크(.mp4/.webm)를 붙여넣거나 로컬 파일을 선택하세요.", load: "로드", file: "파일", none: "비디오 없음", custom: "스트림" },
            fr: { title: "Lecteur", desc: "Collez un lien direct (.mp4/.webm) ou choisissez un fichier.", load: "Charger", file: "Fichier", none: "Aucune vidéo", custom: "Flux" },
            it: { title: "Player", desc: "Incolla un link diretto (.mp4/.webm) o seleziona un file locale.", load: "Carica", file: "File", none: "Nessun video", custom: "Flusso" },
            fa: { title: "پخش کننده", desc: "لینک مستقیم (.mp4/.webm) را وارد کنید یا فایل انتخاب کنید.", load: "بارگذاری", file: "فایل", none: "ویدیویی نیست", custom: "جریان" }
        };

        function updateUI() {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;
            
            document.getElementById('appTitle').textContent = t.title;
            document.getElementById('infoDesc').textContent = t.desc;
            loadUrlBtn.textContent = t.load;
            document.getElementById('labelBrowse').childNodes[0].nodeValue = t.file + " ";

            if (activeSourceType === 'none') videoTitle.textContent = t.none;
            else if (activeSourceType === 'custom') videoTitle.textContent = t.custom;
        }

        langSelect.onchange = updateUI;
        themeToggleBtn.onclick = () => {
            htmlElement.setAttribute('data-theme', htmlElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        };

        loadUrlBtn.onclick = () => {
            const url = videoUrlInput.value.trim();
            if (url) {
                videoPlayer.src = url;
                activeSourceType = 'custom';
                updateUI();
                videoPlayer.load();
                videoPlayer.play().catch(() => {});
            }
        };

        localFileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                activeSourceType = 'local';
                videoTitle.textContent = file.name;
                videoPlayer.src = URL.createObjectURL(file);
                videoPlayer.load();
                videoPlayer.play();
            }
        };
    </script>
</body>
</html>
