<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Video Dashboard</title>
    <style>
        :root {
            --bg-base: #f2f2f7;
            --bg-surface: #ffffff;
            --bg-hover: #f5f5f7;
            --border-color: #e5e5ea;
            --accent: #007aff;
            --accent-hover: #005ec4;
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] {
            --bg-base: #09090b;
            --bg-surface: #121216;
            --bg-hover: #1c1c24;
            --border-color: #27272a;
            --accent: #0a84ff;
            --accent-hover: #0062cc;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .dashboard {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        /* Theme Toggle Button */
        .theme-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .theme-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        /* Instructions Card */
        .instructions-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: var(--shadow);
        }

        .instructions-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .instructions-text {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.4;
            margin: 0;
        }

        /* Control Containers */
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow);
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg-base);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            background: var(--bg-surface);
            border-color: var(--accent);
        }

        .action-btn, .file-label {
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            transition: background 0.2s ease;
        }

        .action-btn:hover, .file-label:hover {
            background: var(--accent-hover);
        }

        input[type="file"] {
            display: none;
        }

        .control-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Player Section */
        .player-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            outline: none;
        }

        .video-info {
            padding: 14px 16px;
            border-top: 1px solid var(--border-color);
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header-row">
            <h1>My Video Dashboard</h1>
            <button class="theme-btn" id="themeToggleBtn">Switch Theme</button>
        </div>

        <div class="instructions-card">
            <div class="instructions-title">Instructions</div>
            <p class="instructions-text">
                Paste a direct video link (ending in .mp4 or .webm) into the stream box and click <strong>Load Link</strong>, or pick a video file directly from your device.
            </p>
        </div>

        <div class="controls-container">
            <div class="control-card">
                <span class="control-label">URL Stream:</span>
                <input type="text" id="videoUrlInput" placeholder="Paste direct .mp4 link..." />
                <button class="action-btn" id="loadUrlBtn">Load Link</button>
            </div>

            <div class="control-card">
                <span class="control-label" id="fileStatusText">Device File:</span>
                <label class="file-label">
                    Browse File
                    <input type="file" id="localFileInput" accept="video/*">
                </label>
            </div>
        </div>

        <div class="player-wrapper">
            <video id="mainVideoPlayer" controls playsinline></video>
            <div class="video-info">
                <div class="video-title" id="currentVideoTitle">No video loaded</div>
            </div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('mainVideoPlayer');
        const videoTitle = document.getElementById('currentVideoTitle');
        const videoUrlInput = document.getElementById('videoUrlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');
        const localFileInput = document.getElementById('localFileInput');
        const fileStatusText = document.getElementById('fileStatusText');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlElement = document.documentElement;

        // Theme Toggle Logic
        themeToggleBtn.onclick = () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            themeToggleBtn.textContent = newTheme === 'light' ? 'Dark Mode' : 'Light Mode';
        };

        // Initialize theme button text
        themeToggleBtn.textContent = 'Dark Mode';

        // Load pasted link
        loadUrlBtn.onclick = () => {
            const url = videoUrlInput.value.trim();
            if (url) {
                videoPlayer.src = url;
                videoTitle.textContent = "Custom Link Stream";
                videoPlayer.load();
                videoPlayer.play().catch(e => alert("Could not play video. Make sure it's a direct media link!"));
            }
        };

        // Load local file from computer
        localFileInput.onchange = (event) => {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoPlayer.src = fileURL;
                videoTitle.textContent = `Local File: ${file.name}`;
                fileStatusText.textContent = `Loaded: ${file.name}`;
                videoPlayer.load();
                videoPlayer.play();
            }
        };
    </script>
</body>
</html>
