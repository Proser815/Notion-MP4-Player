<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Micro iOS Player</title>
    <style>
        :root {
            --bg-base: transparent;
            --bg-surface: #fcf8ec;
            --bg-hover: #f5eedb;
            --border-color: rgba(230, 210, 150, 0.4);
            --accent: #e5b83b;
            --accent-hover: #d4a72d;
            --text-main: #2c2c2e;
            --text-muted: #8e8e93;
            --radius: 14px;
            --shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            --transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="dark"] {
            --bg-base: transparent;
            --bg-surface: #1c1c1e;
            --bg-hover: #2c2c2e;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #ffb300;
            --accent-hover: #e09b00;
            --text-main: #f5f5f7;
            --text-muted: #98989d;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .dashboard {
            width: 100%;
            max-width: 680px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 8px;
            align-items: stretch;
            transition: var(--transition);
        }

        .player-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
        }

        h1 {
            font-size: 12px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .header-controls {
            display: flex;
            gap: 4px;
        }

        select, .theme-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: var(--transition);
        }

        select:hover, .theme-btn:hover {
            background: var(--bg-hover);
            transform: scale(1.02);
        }

        .info-bar {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px 10px;
            box-shadow: var(--shadow);
            flex: 1;
            display: flex;
            align-items: center;
        }

        .info-text {
            font-size: 9px;
            color: var(--text-muted);
            line-height: 1.3;
            margin: 0;
        }

        .control-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow);
        }

        .control-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 5px 8px;
            border-radius: 10px;
            font-size: 9px;
            outline: none;
            transition: var(--transition);
        }

        [data-theme="dark"] input[type="text"] {
            background: rgba(0, 0, 0, 0.2);
        }

        input[type="text"]:focus {
            background: var(--bg-surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(229, 184, 59, 0.2);
        }

        .action-btn, .file-label {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            font-size: 9px;
            white-space: nowrap;
            transition: var(--transition);
            text-align: center;
        }

        .action-btn:hover, .file-label:hover {
            background: var(--accent-hover);
            transform: translateY(-0.5px);
        }

        .action-btn:active, .file-label:active {
            transform: scale(0.96);
        }

        input[type="file"] {
            display: none;
        }

        .player-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            outline: none;
            transition: var(--transition);
        }

        .video-info {
            padding: 6px 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-title {
            font-size: 9px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .fullscreen-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .fullscreen-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        /* Full Webpage / Expand Mode */
        body.fullscreen-mode {
            padding: 0;
            background-color: #000;
        }

        body.fullscreen-mode .dashboard {
            display: flex;
            max-width: 100vw;
            height: 100vh;
            width: 100vw;
            gap: 0;
            position: relative;
        }

        body.fullscreen-mode .player-column {
            width: 100vw;
            height: 100vh;
        }

        body.fullscreen-mode .player-wrapper {
            border: none;
            border-radius: 0;
            box-shadow: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        body.fullscreen-mode video {
            width: 100vw;
            height: 100vh;
            aspect-ratio: unset;
            object-fit: contain;
            border-radius: 0;
            border: none;
            background: #000;
        }

        /* Hover Overlay Menu on the Right */
        body.fullscreen-mode .controls-column {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: 90vh;
            background: rgba(252, 248, 236, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        [data-theme="dark"] body.fullscreen-mode .controls-column {
            background: rgba(28, 28, 30, 0.85);
        }

        body.fullscreen-mode .player-wrapper .video-info {
            display: none; /* Hide standard bottom bar inside expand view */
        }

        /* When hovering the video/screen in expand mode, slide/fade in the menu */
        body.fullscreen-mode.show-controls .controls-column {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        @media (max-width: 540px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            body.fullscreen-mode .controls-column {
                width: calc(100vw - 40px);
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Left Column: Player -->
        <div class="player-column" id="playerColumn">
            <div class="player-wrapper" id="playerWrapper">
                <video id="mainVideoPlayer" controls playsinline></video>
                <div class="video-info">
                    <div class="video-title" id="currentVideoTitle">No video</div>
                    <button class="fullscreen-btn" id="expandBtn">Expand</button>
                </div>
            </div>
        </div>

        <!-- Right Column: Controls, Settings & Info -->
        <div class="controls-column" id="controlsColumn">
            <div class="header-row">
                <h1 id="appTitle">Player</h1>
                <div class="header-controls">
                    <select id="langSelect" aria-label="Language">
                        <option value="en">EN</option>
                        <option value="zh">中</option>
                        <option value="ja">日</option>
                        <option value="de">DE</option>
                        <option value="ko">한</option>
                        <option value="fr">FR</option>
                        <option value="it">IT</option>
                        <option value="fa">فا</option>
                    </select>
                    <button class="theme-btn" id="themeToggleBtn">Theme</button>
                    <button class="fullscreen-btn" id="minimizeBtn" style="font-weight: 600; padding: 3px 6px;">✕</button>
                </div>
            </div>

            <div class="control-card">
                <div class="control-row">
                    <input type="text" id="videoUrlInput" placeholder="URL (.mp4/.webm)..." />
                    <button class="action-btn" id="loadUrlBtn">Load</button>
                </div>
                <div class="control-row">
                    <label class="file-label" id="labelBrowse" style="width: 100%;">
                        Choose Local File
                        <input type="file" id="localFileInput" accept="video/*">
                    </label>
                </div>
            </div>

            <div class="info-bar">
                <p class="info-text" id="infoDesc">Paste direct video link or pick a local device file to play.</p>
            </div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('mainVideoPlayer');
        const videoTitle = document.getElementById('currentVideoTitle');
        const videoUrlInput = document.getElementById('videoUrlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');
        const localFileInput = document.getElementById('localFileInput');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const langSelect = document.getElementById('langSelect');
        const expandBtn = document.getElementById('expandBtn');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const htmlElement = document.documentElement;

        let activeSourceType = 'none';
        let mouseTimer = null;

        const translations = {
            en: { title: "Player", desc: "Paste direct video link or pick a local device file to play.", load: "Load", file: "Choose Local File", none: "No video", custom: "Stream", expand: "Expand" },
            zh: { title: "播放器", desc: "粘贴直接视频链接或选择本地文件播放。", load: "加载", file: "选择本地文件", none: "无视频", custom: "流", expand: "全屏" },
            ja: { title: "プレーヤー", desc: "直接リンクを貼り付けるかファイルを選択。", load: "読込", file: "ファイル選択", none: "動画なし", custom: "ストリーム", expand: "拡大" },
            de: { title: "Player", desc: "Direkten Link einfügen oder lokale Datei wählen.", load: "Laden", file: "Datei wählen", none: "Kein Video", custom: "Stream", expand: "Vollbild" },
            ko: { title: "플레이어", desc: "비디오 링크를 붙여넣거나 로컬 파일을 선택하세요.", load: "로드", file: "로컬 파일 선택", none: "비디오 없음", custom: "스트림", expand: "확대" },
            fr: { title: "Lecteur", desc: "Collez un lien direct ou choisissez un fichier.", load: "Charger", file: "Choisir un fichier", none: "Aucune vidéo", custom: "Flux", expand: "Agrandir" },
            it: { title: "Player", desc: "Incolla un link o seleziona un file locale.", load: "Carica", file: "Scegli file", none: "Nessun video", custom: "Flusso", expand: "Espandi" },
            fa: { title: "پخش کننده", desc: "لینک مستقیم را وارد کنید یا فایل انتخاب کنید.", load: "بارگذاری", file: "انتخاب فایل", none: "ویدیویی نیست", custom: "جریان", expand: "بزرگ" }
        };

        function updateUI() {
            const lang = langSelect.value;
            const t = translations[lang] || translations.en;
            
            document.getElementById('appTitle').textContent = t.title;
            document.getElementById('infoDesc').textContent = t.desc;
            loadUrlBtn.textContent = t.load;
            document.getElementById('labelBrowse').childNodes[0].nodeValue = t.file + " ";
            expandBtn.textContent = t.expand;

            if (activeSourceType === 'none') videoTitle.textContent = t.none;
            else if (activeSourceType === 'custom') videoTitle.textContent = t.custom;
        }

        langSelect.onchange = updateUI;
        themeToggleBtn.onclick = () => {
            htmlElement.setAttribute('data-theme', htmlElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        };

        const toggleFullscreen = () => {
            document.body.classList.toggle('fullscreen-mode');
            if (!document.body.classList.contains('fullscreen-mode')) {
                document.body.classList.remove('show-controls');
            }
            updateUI();
        };

        expandBtn.onclick = toggleFullscreen;
        minimizeBtn.onclick = toggleFullscreen;

        // Hover tracking for expand mode
        document.addEventListener('mousemove', (e) => {
            if (!document.body.classList.contains('fullscreen-mode')) return;

            // Check if mouse is hovering over the right control menu itself
            const controlsMenu = document.getElementById('controlsColumn');
            const rect = controlsMenu.getBoundingClientRect();
            const isOverMenu = (
                e.clientX >= rect.left - 20 &&
                e.clientX <= rect.right + 20 &&
                e.clientY >= rect.top - 20 &&
                e.clientY <= rect.bottom + 20
            );

            if (isOverMenu) {
                clearTimeout(mouseTimer);
                return;
            }

            document.body.classList.add('show-controls');
            clearTimeout(mouseTimer);

            mouseTimer = setTimeout(() => {
                document.body.classList.remove('show-controls');
            }, 2000);
        });

        loadUrlBtn.onclick = () => {
            const url = videoUrlInput.value.trim();
            if (url) {
                videoPlayer.src = url;
                activeSourceType = 'custom';
                updateUI();
                videoPlayer.load();
                videoPlayer.play().catch(() => {});
            }
        };

        localFileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                activeSourceType = 'local';
                videoTitle.textContent = file.name;
                videoPlayer.src = URL.createObjectURL(file);
                videoPlayer.load();
                videoPlayer.play();
            }
        };
    </script>
</body>
</html>
